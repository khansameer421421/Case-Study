---
# Local demo inventory: proves the collection -> aggregation -> report path
# without any AWS account. Two aliases point at this machine, and one host is
# deliberately unreachable so the report shows coverage-gap handling.
all:
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    linux:
      hosts:
        demo-web-01:
          ansible_connection: local
          aws_account_id: "222222222222"
          aws_account_name: acquired-co-a-prod
          aws_region: us-east-1
        demo-db-01:
          ansible_connection: local
          aws_account_id: "333333333333"
          aws_account_name: acquired-co-b-prod
          aws_region: eu-central-1
        demo-legacy-01:
          # TEST-NET-1 address, never routable: simulates a VM whose SSM
          # agent is down or that lacks an instance profile.
          ansible_host: 192.0.2.10
          ansible_connection: ssh
          ansible_ssh_common_args: "-o ConnectTimeout=3"
          # host-level so it outranks playbooks/group_vars/all.yml
          disk_connect_timeout: 10
          aws_account_id: "333333333333"
          aws_account_name: acquired-co-b-prod
          aws_region: eu-central-1
