[defaults]
# Per-account aws_ec2 inventory sources are generated into this directory
# by playbooks/generate_inventory.yml. Override with -i for the local demo.
inventory = inventories/aws
roles_path = roles
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
host_key_checking = False
retry_files_enabled = False

# Scale knobs: SSM sessions are cheap for the controller, so run wide.
forks = 50
timeout = 60
gather_timeout = 30

# Fact cache lets the alarm play reuse what the collector found.
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 7200

callbacks_enabled = ansible.posix.profile_tasks
result_format = yaml

[inventory]
enable_plugins = amazon.aws.aws_ec2, ansible.builtin.yaml, ansible.builtin.ini
# Cache EC2 API results so repeated runs don't hammer DescribeInstances.
cache = True
cache_plugin = ansible.builtin.jsonfile
cache_connection = .cache/inventory
cache_timeout = 600
